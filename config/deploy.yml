# Deploy com Kamal numa VPS. Valores específicos do ambiente vêm de variáveis de ambiente
# (veja .env.example e docs/DEPLOY.md). Segredos vêm de .kamal/secrets.
<% require "dotenv"; Dotenv.load(".env") if File.exist?(".env") %>

# Name of your application. Used to uniquely configure containers.
service: zen_gastronomy

# Name of the container image (ex.: ghcr.io/sua-conta/zen_gastronomy ou sua-conta/zen_gastronomy).
image: <%= ENV.fetch("KAMAL_IMAGE") %>

# Deploy to these servers.
servers:
  web:
    - <%= ENV.fetch("KAMAL_SERVER_IP") %>
  # job:
  #   hosts:
  #     - <%= ENV["KAMAL_SERVER_IP"] %>
  #   cmd: bin/jobs

# SSL automático via Let's Encrypt (o DNS do APP_HOST precisa apontar para o servidor).
# Se usar Cloudflare, configure o modo SSL/TLS como "Full".
proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST") %>
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

# Credentials for your image host.
registry:
  server: <%= ENV.fetch("KAMAL_REGISTRY_SERVER", "docker.io") %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>
  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - ZEN_GASTRONOMY_DATABASE_PASSWORD
    - SMTP_USERNAME
    - SMTP_PASSWORD
  clear:
    APP_HOST: <%= ENV.fetch("APP_HOST") %>
    # Postgres do accessory "db" abaixo, na rede docker do Kamal.
    DB_HOST: zen_gastronomy-db
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true
    SMTP_ADDRESS: "<%= ENV.fetch("SMTP_ADDRESS", "") %>"
    SMTP_PORT: "<%= ENV.fetch("SMTP_PORT", "587") %>"
    MAILER_FROM: "<%= ENV.fetch("MAILER_FROM", "") %>"
    # Origens liberadas para CORS (vazio = nenhuma; o app não tem API).
    CORS_ORIGINS: "<%= ENV.fetch("CORS_ORIGINS", "") %>"

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  # Backup completo do Postgres para a saída padrão:
  #   bin/kamal db-backup > backup-$(date +%F).sql
  db-backup: accessory exec db --reuse "pg_dumpall -U zen_gastronomy"

# Volume persistente para os arquivos do Active Storage (fotos de perfil).
# Recomendado: fazer backup desse volume fora do servidor.
volumes:
  - "zen_gastronomy_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server

# Use a different ssh user than root
# ssh:
#   user: app

# PostgreSQL no mesmo servidor. A porta só escuta em 127.0.0.1 (não fica exposta na internet);
# o app acessa pela rede docker do Kamal (DB_HOST=zen_gastronomy-db).
# O usuário do POSTGRES_USER é superuser, então `db:prepare` cria também os bancos
# _cache, _queue e _cable.
accessories:
  db:
    image: postgres:17
    host: <%= ENV.fetch("KAMAL_SERVER_IP") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: zen_gastronomy
        POSTGRES_DB: zen_gastronomy_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
