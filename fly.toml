# fly.toml app configuration file generated for zen-gastronomy on 2026-11-20T05:20:55Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'zen-gastronomy'
primary_region = 'gru'
console_command = '/rails/bin/rails console'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
