# fly.toml app configuration file generated for zen-gastronomy on 2026-11-20T05:20:55Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#
# Segredos (não ficam aqui): fly secrets set RAILS_MASTER_KEY=... SMTP_USERNAME=... SMTP_PASSWORD=...
# O banco é configurado pelo DATABASE_URL (veja docs/DEPLOY.md).

app = 'zen-gastronomy'
primary_region = 'gru'
console_command = '/rails/bin/rails console'

[build]

[env]
  # Domínio público: o app só responde a este Host (config.hosts) e o usa nos links de e-mail.
  APP_HOST = 'zen-gastronomy.fly.dev'
  # O Thruster escuta nesta porta (o container roda sem root, então não pode usar a 80 no Fly).
  HTTP_PORT = '8080'
  # Jobs (Solid Queue) rodam dentro do Puma.
  SOLID_QUEUE_IN_PUMA = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  # A máquina para quando não há acesso e liga no primeiro request (primeiro acesso fica mais lento).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    timeout = '5s'
    method = 'GET'
    path = '/up'

# Fotos de perfil (Active Storage em disco): o disco da máquina é apagado a cada deploy.
# Crie o volume uma vez: fly volumes create storage --region gru --size 1
[mounts]
  source = 'storage'
  destination = '/rails/storage'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
